# 共有 Colima プロファイル `ddev` のテンプレート
# 値の伝わり方: 初回の VM 作成時に scripts/colima-start.sh が本ファイルの値を読み取り、
# colima の CLI フラグへ展開する。ファイル自体はコピーされない（colima は自身の保存先である
# ~/.colima/ddev/colima.yaml をフラグから生成する）。
# したがって VM 作成後に本ファイルを編集しても、それだけでは VM に反映されない
# （反映のさせ方は手順書の「共有 VM のリソースを変更する」を参照）。
#
# この VM は「ホスト上の全 DDEV プロジェクトが共用する 1 台」である。
# macOS の 443 は 1 つしかなく、それを占有する DDEV ルータも 1 Docker ホストに 1 つのため、
# ポートなしのクリーン HTTPS URL を複数プロジェクトで同時に成立させる方法はこれしかない。
#
# ★★★ 影響範囲 ★★★
# この VM を停止すると、起動中の全プロジェクトが同時に止まる。
# ディスク枯渇も全プロジェクトを巻き込む。使用量の定期確認を手順書の運用に含めること。
#
# 本ファイルは全プロジェクトで内容が同一になる（プロジェクト固有値を含まない）。
# VM は最初に起動した 1 つだけが作成され、以降は既存 VM が優先される。
# 2 つ目以降のプロジェクトで値を変えても VM には反映されないため、
# colima-start.sh が既存 VM の実リソースとの差異を警告する。
#
# 重要な不可変項目（VM 作成後の変更不可）: vmType, mountType, arch
# 誤って起動すると colima delete ddev → 再作成が必要となり、
# 全プロジェクトの DB データが消失する。事前 export を手順書に明記すること。

# --- VM リソース割当（Apple Silicon 前提 / ホスト共通）---
# 変更するには VM を停止してから本ファイルを編集し、再起動する（手順書のリソース変更手順）。
# disk は拡張のみ可能で縮小できない。
cpu: __COLIMA_CPU__                  # コアは時分割で共有されるためプロジェクト数で積み上げない。最も重い処理の並列度で決まる
memory: __COLIMA_MEMORY__               # GiB。db×3（buffer pool 512M + α）＋ web×3 ＋ ルータ ＋ ゲスト OS の積み上げ
disk: __COLIMA_DISK__                # GiB（sparse 確保）。過大にするとディスク枯渇の早期検知を妨げる

# --- アーキテクチャ ---
arch: aarch64
cpuType: host           # ホスト CPU の拡張命令（AMX/Neon 等）をそのまま使う

# --- 仮想化バックエンド（変更不可）---
vmType: vz              # Apple Virtualization.framework
mountType: virtiofs     # vmType=vz 必須
rosetta: false          # 全イメージ ARM64 ネイティブ。x86 拡張が必要になった時点で再検討

# --- ネットワーク ---
network:
  address: false        # 追加 IP は割り当てない（DDEV Traefik で完結）
  dns: [1.1.1.1]        # macOS の DNS 設定干渉を回避
