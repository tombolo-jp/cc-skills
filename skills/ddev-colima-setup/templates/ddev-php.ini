; PHP オーバーライド
; 共有 Colima VM に同時 3 プロジェクトが載る前提。PHP-FPM のメモリはプロジェクト数分積み上がる。

memory_limit         = 512M            ; WP 管理画面は 256M で足りるが、プラグイン一括更新・インポータ用に倍を確保
post_max_size        = 128M            ; uploads 総量が GB 級でも単一ファイルは通常 MB オーダー
upload_max_filesize  = 128M
max_execution_time   = 3600            ; 取込・移行作業で必要（メモリを消費しないため据置）
max_input_time       = 3600
max_input_vars       = 3000

display_errors         = On
display_startup_errors = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

mbstring.language        = Japanese
; mbstring.{internal_encoding,http_input,http_output} は PHP 8.2+ で deprecated。
; 代替は top-level の default_charset / internal_encoding（mbstring 拡張は UTF-8 既定で動く）。
default_charset    = UTF-8
internal_encoding  = UTF-8

opcache.enable             = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq    = 0
opcache.memory_consumption = 128       ; WordPress + 一般的なプラグイン構成なら 128MB で十分

session.gc_maxlifetime = 7200          ; 長時間セッション用
